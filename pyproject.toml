[project]
name = "merlion-guardrails"
version = "0.1.0"
description = "Guardrails for a fictional bank's support chatbot, tested against IMDA's Starter Kit with Project Moonshot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai>=1.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "transformers>=4.40",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
